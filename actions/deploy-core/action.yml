name: RASGO deploy steps
description: >-
  One step of a RASGO deploy (RINF-54): read rasgo.deploy.yml, ask RASGO Core with deploy-start, check the health
  of the environment and close the deploy in Core. Used by the reusable deploy-*.yml workflows of this repository;
  the deploy state lives in RUNNER_TEMP between steps. Settings come as environment variables of the step.
inputs:
  command:
    description: require, contract, branch-head, version-file, start, health or finish
    required: true
  args:
    description: Arguments of the command (secret names for require, the published folder for version-file)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
      # ARGS splits on purpose: secret names or one folder, never user text.
      run: |
        # shellcheck disable=SC2086
        "$GITHUB_ACTION_PATH/core.sh" "$COMMAND" $ARGS
