# Reusable RASGO deploy, static site on Cloudflare Pages (RINF-54, DEV-12, D-111): reads rasgo.deploy.yml, builds
# this commit, asks RASGO Core with deploy-start, uploads the build with wrangler (Direct Upload), waits until the
# health path answers with this commit and closes the deploy in Core with deploy-finish. Production deploys with Sergio's merge, which Core
# checks in deploy-start (D-111). The build gets a version.json (component, version, commit) unless it has one.
# The Pages project is a Direct Upload project: its Git integration, if any, does not deploy production by itself.
# Usage in each repository (.github/workflows/deploy.yml), with BWS_ACCESS_TOKEN (and the variable BWS_PROJECT_ID) in its
# staging and production environments:
#
#   name: Deploy
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#     workflow_dispatch:
#       inputs:
#         environment: { type: choice, options: [production, staging], default: production }
#         rollback_of: { type: string, required: false }
#         task: { type: string, required: false }
#   jobs:
#     deploy:
#       uses: rasgo-studio/.github/.github/workflows/deploy-static.yml@main
#       with:
#         environment: ${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
#         rollback_of: ${{ inputs.rollback_of }}
#         task: ${{ inputs.task }}
#         pages-project: example-org
#       secrets: inherit
#
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production, as in rasgo.deploy.yml
        type: string
        required: true
      approval_id:
        description: Only for a Core older than RCOR-87, which still asks for an approval; goes once that Core is no longer live
        type: string
        default: ""
      rollback_of:
        description: deployment_id of the failed deploy that this one undoes; Core closes it as rolled_back
        type: string
        default: ""
      task:
        description: Plane task code (ACME01WEB-23), so Core can report the result on it
        type: string
        default: ""
      app:
        description: App name in Core, when it is not the component of the contract
        type: string
        default: ""
      version:
        description: Version to record in Core; by default the number of the tag, or the short commit
        type: string
        default: ""
      pages-project:
        description: Name of the Cloudflare Pages project
        type: string
        required: true
      production-branch:
        description: Production branch of the Pages project
        type: string
        default: main
      staging-branch:
        description: Pages branch (preview alias) that serves staging
        type: string
        default: staging
      build-command:
        description: Command that builds the site (Nuxt by default, as ci-static.yml)
        type: string
        default: npm ci && npm run generate
      output-dir:
        description: Folder the build publishes
        type: string
        default: .output/public
      node-version:
        type: string
        default: "22"
      wrangler-version:
        description: Exact version of wrangler, the Cloudflare CLI that uploads the build
        type: string
        default: 4.151.0
    secrets:
      BWS_ACCESS_TOKEN:
        description: Token of the Bitwarden Secrets Manager machine account that reads the actions project (D-109); every other secret comes from there; core.sh stops the deploy without it
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets come from this environment of the calling repository (DEV-07).
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOYER: ${{ github.triggering_actor }}
      DEPLOY_ADAPTERS: static
      APPROVAL_ID: ${{ inputs.approval_id }}
      ROLLBACK_OF: ${{ inputs.rollback_of }}
      TASK: ${{ inputs.task }}
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      CORE_URL: ${{ vars.RASGO_CORE_URL || 'https://api.rasgo.studio' }}
      OUTPUT_DIR: ${{ inputs.output-dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Contract
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: contract
      # The build comes before the secrets and deploy-start, so a broken build never reaches Core.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Version file
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: version-file
      # From Bitwarden Secrets Manager only: the environment keeps BWS_ACCESS_TOKEN and nothing else (D-109).
      # After the build, so the build never sees a secret. The values are masked and left for the next steps of this job, which read them from env.
      - name: Secrets
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_PROJECT_ID }}
          BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL || 'https://vault.bitwarden.eu' }}
        with:
          command: secrets
          args: RASGO_CORE_DEPLOY_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
      - name: Start (Core checks who deploys)
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          CORE_TOKEN: ${{ env.RASGO_CORE_DEPLOY_TOKEN }}
        with:
          command: start
      - name: Deploy (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ inputs.pages-project }}
          PAGES_BRANCH: ${{ inputs.environment == 'production' && inputs.production-branch || inputs.staging-branch }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "$OUTPUT_DIR" --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Health
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: health
      - name: Finish (record in Core)
        if: always()
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          CORE_TOKEN: ${{ env.RASGO_CORE_DEPLOY_TOKEN }}
        with:
          command: finish
