# Reusable RASGO CI, Laravel (5-desarrollo/github.md of RASGO OS): task-code branch, then tests, lint and build once the app exists.
# Usage in each repository (.github/workflows/ci.yml):
#
#   name: CI
#   on: [pull_request]
#   jobs:
#     ci:
#       uses: rasgo-studio/.github/.github/workflows/ci-laravel.yml@main
#
name: CI

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: "8.5"
      node-version:
        type: string
        default: "22"

jobs:
  # The branch starts with a Plane identifier and a number (ACME01WEB-23-slug, RMGT-12-slug).
  # Dependabot and release-please branches are excluded. If it does not comply, it fails before testing anything.
  branch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Branch with task code
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s' "$BRANCH" | grep -Eq '^(dependabot/|release-please--)'; then exit 0; fi
          # The simplification break opens no Plane tasks (Sergio, 8 Nov 2026): its one branch passes until the break ends.
          if [ "$BRANCH" = "claude/project-thread-t5d88o" ]; then exit 0; fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+-[A-Za-z0-9._-]+$'; then
            echo "La rama $BRANCH no empieza por el código de una tarea de Plane y un número (5-desarrollo/github.md)."
            exit 1
          fi

  # A repository born from rasgo-template-laravel has no app until its first development task creates it: without
  # composer.json there is nothing to lint, build or test, so the laravel job is skipped instead of failing.
  app:
    runs-on: ubuntu-latest
    outputs:
      laravel: ${{ steps.check.outputs.laravel }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false
      - name: Laravel app present
        id: check
        run: |
          if [ -f composer.json ]; then
            echo "laravel=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Todavía no hay app Laravel (sin composer.json): solo se comprueba la rama."
            echo "laravel=false" >> "$GITHUB_OUTPUT"
          fi

  laravel:
    needs: [branch, app]
    if: ${{ always() && needs.app.outputs.laravel == 'true' && (needs.branch.result == 'success' || needs.branch.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
      - name: PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: JS dependencies
        run: npm ci
      - name: Lint (Pint)
        run: vendor/bin/pint --test
      - name: Build
        run: npm run build
      - name: Test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Tests (Pest)
        run: php artisan test

  # The one check the ruleset of main asks for in a repository that calls this workflow: "ci / ci" is green only when
  # no job above failed or was cancelled (a skipped one is fine). 5-desarrollo/github.md of RASGO OS.
  ci:
    needs: [branch, app, laravel]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) echo "Algún paso del CI ha fallado."; exit 1 ;; esac
