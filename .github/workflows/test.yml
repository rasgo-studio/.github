# Checks of this repository (RINF-54): the shared deploy steps, their tests and that every workflow parses.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck actions/deploy-core/core.sh tests/*.sh
      - name: Tests
        run: bash tests/deploy-core.test.sh
      - name: Workflows and actions parse
        run: |
          for file in .github/workflows/*.yml actions/*/action.yml; do
            yq -e '.jobs // .runs' "$file" > /dev/null || { echo "::error file=$file::no es un workflow o una action válida"; exit 1; }
          done
