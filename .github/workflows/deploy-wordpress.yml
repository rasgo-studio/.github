# Reusable RASGO deploy, WordPress on Ploi (RINF-54, DEV-12, D-111): reads rasgo.deploy.yml, asks RASGO Core with
# deploy-start, calls the Ploi deploy webhook of the site (its deploy script pulls the repository and builds the
# theme), checks the health path and closes the deploy in Core with deploy-finish. Production deploys with Sergio's
# merge of the version PR, which publishes the tag, and Core checks it in deploy-start (D-111). Since RINF-4 an Action no longer reaches the servers by SSH: Ploi does the deploy.
# Usage in each repository (.github/workflows/deploy.yml), with BWS_ACCESS_TOKEN (and the variable BWS_PROJECT_ID) in its
# staging and production environments:
#
#   name: Deploy
#   on:
#     push:
#       tags: ['v*']
#     workflow_dispatch:
#       inputs:
#         environment: { type: choice, options: [production, staging], default: production }
#         rollback_of: { type: string, required: false }
#         task: { type: string, required: false }
#   jobs:
#     deploy:
#       uses: rasgo-studio/.github/.github/workflows/deploy-wordpress.yml@main
#       with:
#         environment: ${{ inputs.environment || (github.ref_type == 'tag' && 'production') || 'staging' }}
#         rollback_of: ${{ inputs.rollback_of }}
#         task: ${{ inputs.task }}
#       secrets: inherit
#
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production, as in rasgo.deploy.yml
        type: string
        required: true
      approval_id:
        description: Only for a Core older than RCOR-87, which still asks for an approval; goes once that Core is no longer live
        type: string
        default: ""
      rollback_of:
        description: deployment_id of the failed deploy that this one undoes; Core closes it as rolled_back
        type: string
        default: ""
      task:
        description: Plane task code (ACME01WEB-23), so Core can report the result on it
        type: string
        default: ""
      app:
        description: App name in Core, when it is not the component of the contract
        type: string
        default: ""
      version:
        description: Version to record in Core; by default the number of the tag, or the short commit
        type: string
        default: ""
      ploi-branch:
        description: Branch the Ploi site pulls, when the environment deploys a tag
        type: string
        default: main
    secrets:
      BWS_ACCESS_TOKEN:
        description: Token of the Bitwarden Secrets Manager machine account that reads the actions project (D-109); every other secret comes from there; core.sh stops the deploy without it
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets come from this environment of the calling repository (DEV-07).
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOYER: ${{ github.triggering_actor }}
      DEPLOY_ADAPTERS: wordpress
      APPROVAL_ID: ${{ inputs.approval_id }}
      ROLLBACK_OF: ${{ inputs.rollback_of }}
      TASK: ${{ inputs.task }}
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      PLOI_BRANCH: ${{ inputs.ploi-branch }}
      CORE_URL: ${{ vars.RASGO_CORE_URL || 'https://api.rasgo.studio' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rasgo.deploy.yml
          sparse-checkout-cone-mode: false
      - name: Contract
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: contract
      # From Bitwarden Secrets Manager only: the environment keeps BWS_ACCESS_TOKEN and nothing else (D-109).
      # The values are masked and left for the next steps of this job, which read them from env.
      - name: Secrets
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_PROJECT_ID }}
          BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL || 'https://vault.bitwarden.eu' }}
        with:
          command: secrets
          args: RASGO_CORE_DEPLOY_TOKEN PLOI_DEPLOY_WEBHOOK
      # Ploi pulls the head of its branch, not a commit: only that head can be the commit of this run.
      - name: Branch the server pulls
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: branch-head
      - name: Start (Core checks who deploys)
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          CORE_TOKEN: ${{ env.RASGO_CORE_DEPLOY_TOKEN }}
        with:
          command: start
      - name: Deploy (Ploi)
        env:
          WEBHOOK: ${{ env.PLOI_DEPLOY_WEBHOOK }}
        run: |
          curl -fsS -X POST --max-time 30 -o /dev/null "$WEBHOOK"
          echo "Despliegue pedido a Ploi."
      - name: Health
        uses: rasgo-studio/.github/actions/deploy-core@main
        with:
          command: health
      - name: Finish (record in Core)
        if: always()
        uses: rasgo-studio/.github/actions/deploy-core@main
        env:
          CORE_TOKEN: ${{ env.RASGO_CORE_DEPLOY_TOKEN }}
        with:
          command: finish
