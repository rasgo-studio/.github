# Reusable RASGO CI, WordPress (rasgo-base child theme, WPR-06) (DEV-02, D-086): task-code branch, tests, lint and build.
# Usage in each repository (.github/workflows/ci.yml):
#
#   name: CI
#   on: [pull_request]
#   jobs:
#     ci:
#       uses: rasgo-studio/.github/.github/workflows/ci-wordpress.yml@main
#
name: CI

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: "8.3"
      node-version:
        type: string
        default: "22"

jobs:
  # The branch starts with a Plane identifier and a number (ACME01WEB-23-slug, RMGT-12-slug).
  # Dependabot and release-please branches are excluded. If it does not comply, it fails before testing anything.
  branch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Branch with task code
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s' "$BRANCH" | grep -Eq '^(dependabot/|release-please--)'; then exit 0; fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+-[A-Za-z0-9._-]+$'; then
            echo "La rama $BRANCH no empieza por un identificador de Plane y un número (DEV-02)."
            exit 1
          fi

  wordpress:
    needs: branch
    if: ${{ always() && (needs.branch.result == 'success' || needs.branch.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHP dependencies and lint (if composer.json exists)
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress
            [ -x vendor/bin/phpcs ] && vendor/bin/phpcs || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Theme assets (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci && npm run build --if-present; fi
