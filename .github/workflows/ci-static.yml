# Reusable RASGO CI, static sites (Nuxt) (5-desarrollo/github.md of RASGO OS): task-code branch, tests, lint and build.
# Usage in each repository (.github/workflows/ci.yml):
#
#   name: CI
#   on: [pull_request]
#   jobs:
#     ci:
#       uses: rasgo-studio/.github/.github/workflows/ci-static.yml@main
#
name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  # The branch starts with a Plane identifier and a number (ACME01WEB-23-slug, RMGT-12-slug).
  # Dependabot and release-please branches are excluded. If it does not comply, it fails before testing anything.
  branch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Branch with task code
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s' "$BRANCH" | grep -Eq '^(dependabot/|release-please--)'; then exit 0; fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+-[A-Za-z0-9._-]+$'; then
            echo "La rama $BRANCH no empieza por el código de una tarea de Plane y un número (5-desarrollo/github.md)."
            exit 1
          fi

  node:
    needs: branch
    if: ${{ always() && (needs.branch.result == 'success' || needs.branch.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test --if-present

  # The one check the ruleset of main asks for in a repository that calls this workflow: "ci / ci" is green only when
  # no job above failed or was cancelled (a skipped one is fine). 5-desarrollo/github.md of RASGO OS.
  ci:
    needs: [branch, node]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) echo "Algún paso del CI ha fallado."; exit 1 ;; esac
